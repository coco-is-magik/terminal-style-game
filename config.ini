# Engine Configuration

# Display Settings
window_width = 1920
window_height = 1080
grid_width = 260
grid_height = 160
# The bundled renderer/font supports fixed 8x8 glyph cells only.
cell_width = 8
cell_height = 8
target_fps = 120

# Lighting Settings
ambient_light = 0.2
light_bounce_attenuation = 0.2
light_falloff_default = 1.0

# Renderer Settings
raycast_max_distance = 20.0
side_shadow_attenuation = 0.6

# Default Assets
default_material_id = 1
default_palette_id = 1

# Asset Designer
asset_canvas_cols = 20
asset_canvas_rows = 12

# Debug Overlays
debug_display_enabled = 1

# UI Motion
# The ambient loop the backdrop's travelling wave advances over, in milliseconds:
# how long one crossing of the surface takes. This is the material's speed and
# nothing else — the wave, its wavelengths, its direction and the chromatic wake
# are unchanged — so it is a taste value: larger is slower. It applies to the
# backdrop; a state change is a transition and runs at its own pace.
# Allowed range 400..60000.
backdrop_period_ms = 2600
